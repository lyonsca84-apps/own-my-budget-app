<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Log in · Own My Budget</title>
    <meta name="description" content="Log in to your Own My Budget account." />
    <meta name="theme-color" content="#9BE7D3" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet" />
    <script type="module" src="/src/main.ts"></script>
    <script type="module" src="/src/pages/auth.ts"></script>
  </head>
  <body data-nav="account">
    <div class="page">
      <!-- @include header -->
      <main id="main"><section style="background: #9BE7D3; padding: clamp(36px, 6vw, 72px) 20px clamp(64px, 8vw, 96px);"><div class="form-card">
  <span id="intent-pill" hidden style="align-self: flex-start; padding: 6px 14px; border-radius: 999px; background: #E4F6F1; color: #1A6A5E; font-size: 13px; font-weight: 600;"></span>
  <h1 style="margin: 0; font-size: clamp(28px, 3.4vw, 38px); line-height: 1.1; font-weight: 800; letter-spacing: -0.03em;">Welcome back</h1>
  <p id="intent-note" style="margin: 0; font-size: 15px; line-height: 1.55; color: #3A4A63;">Log in to see your plan and billing.</p>
  <div id="confirmed-note" class="notice notice-ok" hidden>Your email is confirmed. Log in to continue.</div>
  <div id="form-alert" class="notice notice-warn" role="alert" hidden></div>
  <div id="not-configured" class="notice notice-info" hidden></div>
  <button type="button" class="btn btn-outline" data-oauth="google"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>Continue with Google</button>
  <div class="auth-divider" role="presentation"><span>or use your email</span></div>
  <form id="auth-form" novalidate style="display: flex; flex-direction: column; gap: 16px;">
    <div class="field"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" required /><span class="error" id="email-error" hidden></span></div>
    <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required /><span class="error" id="password-error" hidden></span></div>
    <button type="submit" class="btn btn-primary">Log in</button>
  </form>
  <a href="/reset-password" style="align-self: center; font-size: 15px; font-weight: 600; text-decoration: underline; text-underline-offset: 4px;">Forgot your password?</a>
  <p style="margin: 0; font-size: 15px; text-align: center;">New to Own My Budget? <a id="switch-link" href="/signup" style="font-weight: 600; text-decoration: underline; text-underline-offset: 4px;">Create an account</a></p>
</div></section></main>
      <!-- @include footer -->

    </div>
  </body>
</html>
