<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reset your password · Own My Budget</title>
    <meta name="description" content="Reset your Own My Budget password." />
    <meta name="theme-color" content="#9BE7D3" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet" />
    <script type="module" src="/src/main.ts"></script>
    <script type="module" src="/src/pages/auth.ts"></script>
  </head>
  <body data-nav="account">
    <div class="page">
      <!-- @include header -->
      <main id="main"><section style="background: #9BE7D3; padding: clamp(36px, 6vw, 72px) 20px clamp(64px, 8vw, 96px);"><div class="form-card">
  <h1 style="margin: 0; font-size: clamp(28px, 3.4vw, 38px); line-height: 1.1; font-weight: 800; letter-spacing: -0.03em;" id="reset-title">Reset your password</h1>
  <p style="margin: 0; font-size: 15px; line-height: 1.55; color: #3A4A63;" id="reset-sub">Enter the email you signed up with. We'll send you a link to choose a new password.</p>
  <div id="form-alert" class="notice notice-warn" role="alert" hidden></div>
  <div id="not-configured" class="notice notice-info" hidden></div>
  <div id="reset-sent" class="notice notice-ok" role="status" hidden>If an account exists for that email, a reset link is on its way. Open it on this device.</div>
  <form id="request-form" novalidate style="display: flex; flex-direction: column; gap: 16px;">
    <div class="field"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" required /><span class="error" id="email-error" hidden></span></div>
    <button type="submit" class="btn btn-primary">Send reset link</button>
  </form>
  <form id="update-form" novalidate hidden style="display: flex; flex-direction: column; gap: 16px;">
    <div class="field"><label for="new-password">New password</label><input id="new-password" name="new-password" type="password" autocomplete="new-password" minlength="8" required aria-describedby="new-password-hint" /><span class="hint" id="new-password-hint">At least 8 characters.</span><span class="error" id="new-password-error" hidden></span></div>
    <button type="submit" class="btn btn-primary">Save new password</button>
  </form>
  <a href="/login" style="align-self: center; font-size: 15px; font-weight: 600; text-decoration: underline; text-underline-offset: 4px;">Back to log in</a>
</div></section></main>
      <!-- @include footer -->

    </div>
  </body>
</html>
