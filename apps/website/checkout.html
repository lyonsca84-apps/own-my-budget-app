<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Review your plan · Own My Budget</title>
    <meta name="description" content="Review your Own My Budget plan before secure checkout." />
    <meta name="theme-color" content="#9BE7D3" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet" />
    <script type="module" src="/src/main.ts"></script>
    <script type="module" src="/src/pages/checkout.ts"></script>
  </head>
  <body data-nav="account">
    <div class="page">
      <!-- @include header -->
      <main id="main"><section style="background: #9BE7D3; padding: clamp(36px, 6vw, 72px) 20px clamp(64px, 8vw, 96px);"><div class="form-card">
  <div id="checkout-loading" role="status" style="display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 24px 0;"><span class="spinner" aria-hidden="true"></span><span style="font-size: 15px; color: #3A4A63;">Loading your plan…</span></div>
  <div id="checkout-review" hidden style="display: flex; flex-direction: column; gap: 18px;">
    <h1 style="margin: 0; font-size: clamp(28px, 3.4vw, 38px); line-height: 1.1; font-weight: 800; letter-spacing: -0.03em;">Review your plan</h1>
    <div style="padding: 18px; border-radius: 20px; border: 2px solid #2FC6A4; background: #E4F6F1; display: flex; flex-direction: column; gap: 6px;">
      <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px;"><strong id="review-plan" style="font-size: 18px;"></strong><strong id="review-price" style="font-size: 18px;"></strong></div>
      <span id="review-note" style="font-size: 14px; color: #1F4B47;"></span>
    </div>
    <div role="group" aria-label="Billing period" id="checkout-billing" style="align-self: flex-start; display: flex; padding: 4px; border-radius: 999px; background: #F2F5F4; gap: 4px;">
      <button type="button" data-billing="monthly" aria-pressed="true" style="min-height: 40px; padding: 0 18px; border: none; border-radius: 999px; font-size: 14px; font-weight: 600; cursor: pointer;">Monthly</button>
      <button type="button" data-billing="yearly" aria-pressed="false" style="min-height: 40px; padding: 0 18px; border: none; border-radius: 999px; font-size: 14px; font-weight: 600; cursor: pointer;">Yearly</button>
    </div>
    <p style="margin: 0; font-size: 15px; line-height: 1.55; color: #3A4A63;">You'll finish payment on a secure Stripe checkout page, then come back here.</p>
    <div id="form-alert" class="notice notice-warn" role="alert" hidden></div>
    <button type="button" id="checkout-go" class="btn btn-primary">Continue to checkout</button>
    <a href="/pricing#plans" class="btn btn-outline">Back to plans</a>
  </div>
</div></section></main>
      <!-- @include footer -->

    </div>
  </body>
</html>
